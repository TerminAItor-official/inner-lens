<style>
        @keyframes pulse-organic {
            0% { transform: scale(0.95); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.15; }
            100% { transform: scale(0.95); opacity: 0.3; }
        }
        
        @keyframes message-fade {
            0%, 100% { opacity: 0; transform: translateY(10px); }
            10%, 90% { opacity: 1; transform: translateY(0); }
        }

        .pulse-circle {
            animation: pulse-organic 6s ease-in-out infinite;
            background: radial-gradient(circle, #D8A7A0 0%, transparent 70%);
        }

        /* Message Cycling via Animation Delays (3 messages x 4s = 12s cycle) */
        .message-1 { animation: message-fade 12s infinite 0s; }
        .message-2 { animation: message-fade 12s infinite 4s; opacity: 0; }
        .message-3 { animation: message-fade 12s infinite 8s; opacity: 0; }

        .transition-canvas {
            background-color: #F5F1EA;
            /* Subnormal tint toward Jungian parchment at high specificity */
            background-image: radial-gradient(circle at center, rgba(253, 249, 242, 0.4) 0%, rgba(227, 194, 129, 0.05) 100%);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface text-on-surface font-body selection:bg-secondary-container/30 overflow-hidden">

</div>

</button>
</div>
</header>
<!-- Main Transition Canvas -->

<!-- Organic Pulse Layer -->

<div class="pulse-circle w-[400px] h-[400px] md:w-[600px] md:h-[600px] rounded-full"></div>
</div>
<!-- Content Content Container -->
<div class="relative z-10 text-center px-8">

<div class="mb-12 text-primary opacity-40">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'wght' 200;">auto_awesome</span>
</div>
<!-- Animated Messaging -->
<div class="h-16 relative flex items-center justify-center">
<h2 class="message-1 absolute text-2xl md:text-3xl font-serif italic text-primary-container tracking-tight leading-relaxed">
                    Reading between your lines...
                </h2>
<h2 class="message-2 absolute text-2xl md:text-3xl font-serif italic text-primary-container tracking-tight leading-relaxed">
                    Finding the right lens...
                </h2>
<h2 class="message-3 absolute text-2xl md:text-3xl font-serif italic text-primary-container tracking-tight leading-relaxed">
                    Someone has a question for you...
                </h2>
</div>
<!-- Editorial Subtext -->
<p class="mt-12 font-label text-[11px] uppercase tracking-[0.2em] text-[#4A4541]/50">
                Curating your clinical synthesis
            </p>
</div>
<!-- Abstract Decorative Elements -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 w-px h-24 bg-gradient-to-b from-primary/20 to-transparent"></div>
</main>
<!-- Footer - Transactional Context Suppresses full footer, keeping only minimal anchor -->
