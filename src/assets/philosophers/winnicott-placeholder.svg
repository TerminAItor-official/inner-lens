<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>

    <!-- Soft green background: lighter centre, darker edge -->
    <radialGradient id="bg" cx="52%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#5BAE7A"/>
      <stop offset="100%" stop-color="#1D5C3C"/>
    </radialGradient>

    <!-- Subtle vignette -->
    <radialGradient id="vg" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
    </radialGradient>

    <!-- Very faint inner glow at top for vintage depth -->
    <radialGradient id="gl" cx="50%" cy="5%" r="55%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#c)">
    <!-- Background -->
    <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
    <circle cx="100" cy="100" r="100" fill="url(#gl)"/>

    <!--
      Bust silhouette: warm ivory, facing LEFT.
      Path goes counter-clockwise: up the front of the face, over the
      crown, down the back of the head, then out to shoulders and base.

      Key landmarks (x,y):
        nose tip      ≈ (60, 72)   — leftmost face point
        philtrum      ≈ (72, 88)   — most receded
        chin tip      ≈ (64, 104)
        top of head   ≈ (100, 21)
        back of head  ≈ (150, 62)
        neck width    ≈  x 78–128
    -->
    <path fill="#EDE0C8"
      d="
        M 32,200
        C 38,187 47,176 56,167
        C 63,160 70,153 77,148
        C 81,145 82,140 81,135
        C 80,130 78,126 76,122
        C 74,118 71,115 69,111
        C 67,107 66,104 65,100
        C 64,97  65,93  67,90
        C 68,87  71,85  72,82
        C 73,80  71,77  67,74
        C 64,71  61,68  60,65
        C 59,62  60,58  63,54
        C 66,50  69,46  70,42
        C 71,38  72,34  74,30
        C 76,26  81,22  90,20
        C 99,18  110,18 120,21
        C 130,24 139,30 145,39
        C 151,48 153,59 152,70
        C 151,81 148,91 145,101
        C 142,110 138,119 134,128
        C 130,137 123,145 116,151
        C 109,157 102,163 96,170
        C 90,177 85,185 83,193
        L 168,200
        Z
      "
    />

    <!-- Ear: background-tinted ellipse to suggest concavity on the
         right side of the head (visible in left-facing profile).
         Sits at the temple/ear position ≈ (140, 80). -->
    <ellipse cx="140" cy="82" rx="7" ry="10"
             fill="#2A7A52" opacity="0.45"/>

    <!-- Hairline: a slightly darker warm tone over the crown and back
         of head to suggest the hair mass without over-detailing. -->
    <path fill="#C8AA82" opacity="0.30"
      d="
        M 88,20
        C 99,18 110,18 120,21
        C 130,24 139,30 145,39
        C 151,48 153,59 152,70
        L 148,70
        C 149,59 147,49 141,40
        C 135,31 126,25 116,22
        C 106,19 95,19 84,22
        Z
      "
    />

    <!-- Vignette overlay -->
    <circle cx="100" cy="100" r="100" fill="url(#vg)"/>

    <!-- Thin border ring for definition -->
    <circle cx="100" cy="100" r="99" fill="none"
            stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
</svg>
