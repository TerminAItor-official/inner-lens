<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>

    <!-- Warm ivory-to-sepia background, lit from upper-left like a studio portrait -->
    <radialGradient id="bg" cx="38%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#E8DCC8"/>
      <stop offset="100%" stop-color="#B89E7A"/>
    </radialGradient>

    <!-- Vignette to focus the eye on the figure -->
    <radialGradient id="vg" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(40,22,8,0.38)"/>
    </radialGradient>

    <!-- Subtle highlight top-left -->
    <radialGradient id="hl" cx="30%" cy="18%" r="45%">
      <stop offset="0%"   stop-color="rgba(255,248,235,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,248,235,0)"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#c)">
    <!-- Background -->
    <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
    <circle cx="100" cy="100" r="100" fill="url(#hl)"/>

    <!--
      Brain illustration — dark umber on warm sepia.
      Cerebrum: two symmetrical lobes with a center dip, seated
      on a short brain stem. Sulci drawn as warm-cream strokes.
    -->

    <!-- Cerebrum outline -->
    <path fill="#2C1A0E" d="
      M 100,152
      C 89,152 77,148 67,140
      C 57,132 50,120 47,107
      C 44,94  47,81  53,72
      C 47,63  46,53  53,47
      C 60,41  69,42  75,47
      C 76,41  81,35  88,31
      C 93,26  98,26  100,29
      C 102,26 107,26 112,31
      C 119,35 124,41 125,47
      C 131,42 140,41 147,47
      C 154,53 153,63 147,72
      C 153,81 156,94 153,107
      C 150,120 143,132 133,140
      C 123,148 111,152 100,152
      Z
    "/>

    <!-- Brain stem -->
    <rect x="91" y="149" width="18" height="22" rx="7" fill="#2C1A0E"/>

    <!--
      Sulci — warm cream strokes suggesting gyri folds.
      Colour sampled from mid-background so they read as
      recessed grooves, not surface marks.
    -->

    <!-- Longitudinal fissure (center divide) -->
    <path fill="none" stroke="#C8AE84" stroke-width="2.5"
          stroke-linecap="round" opacity="0.72"
          d="M 100,30 C 99,68 99,112 100,150"/>

    <!-- Left hemisphere: two curved sulci -->
    <path fill="none" stroke="#C8AE84" stroke-width="2"
          stroke-linecap="round" opacity="0.62"
          d="M 73,58 C 69,72 66,87 65,102 C 64,115 66,127 70,136"/>
    <path fill="none" stroke="#C8AE84" stroke-width="1.5"
          stroke-linecap="round" opacity="0.50"
          d="M 55,78 C 53,90 53,103 56,115"/>

    <!-- Right hemisphere: mirror sulci -->
    <path fill="none" stroke="#C8AE84" stroke-width="2"
          stroke-linecap="round" opacity="0.62"
          d="M 127,58 C 131,72 134,87 135,102 C 136,115 134,127 130,136"/>
    <path fill="none" stroke="#C8AE84" stroke-width="1.5"
          stroke-linecap="round" opacity="0.50"
          d="M 145,78 C 147,90 147,103 144,115"/>

    <!-- Vignette overlay -->
    <circle cx="100" cy="100" r="100" fill="url(#vg)"/>

    <!-- Thin inner border ring for photo-frame definition -->
    <circle cx="100" cy="100" r="99" fill="none"
            stroke="rgba(180,150,100,0.18)" stroke-width="1.5"/>
  </g>
</svg>
