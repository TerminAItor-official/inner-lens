<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>

    <!-- Warm ivory-to-sepia background, lit from upper-left like a studio portrait -->
    <radialGradient id="bg" cx="38%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#E8DCC8"/>
      <stop offset="100%" stop-color="#B89E7A"/>
    </radialGradient>

    <!-- Vignette to focus the eye on the figure -->
    <radialGradient id="vg" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(40,22,8,0.38)"/>
    </radialGradient>

    <!-- Subtle highlight top-left -->
    <radialGradient id="hl" cx="30%" cy="18%" r="45%">
      <stop offset="0%"   stop-color="rgba(255,248,235,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,248,235,0)"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#c)">
    <!-- Background -->
    <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
    <circle cx="100" cy="100" r="100" fill="url(#hl)"/>

    <!--
      Bust silhouette: dark warm umber, facing LEFT (classic profile / cameo).

      Landmarks (x,y):
        nose tip      ≈ (58, 73)
        upper lip     ≈ (70, 89)
        chin          ≈ (63, 106)
        forehead      ≈ (78, 22)
        crown         ≈ (102, 18)
        back of head  ≈ (148, 58)
        nape          ≈ (130, 148)
        shoulder base ≈ (175, 200) and (28, 200)
    -->
    <path fill="#2C1A0E"
      d="
        M 28,200
        C 36,183 48,168 58,158
        C 65,151 72,144 78,138
        C 82,134 83,129 82,124
        C 81,118 78,113 75,108
        C 72,103 69,99  67,95
        C 65,91  64,88  65,84
        C 66,80  68,77  70,74
        C 72,71  72,68  69,65
        C 66,62  62,58  60,54
        C 58,50  58,46  61,42
        C 64,38  68,34  71,30
        C 74,26  78,22  85,20
        C 93,17  104,17 114,20
        C 124,23 133,30 140,40
        C 147,50 150,62 149,74
        C 148,86 144,97 140,107
        C 136,117 131,126 127,135
        C 123,144 117,153 110,161
        C 103,169 96,177  91,186
        C 88,191 86,196  85,200
        L 172,200
        Z
      "
    />

    <!--
      Jacket / collar suggestion: slightly lighter warm-brown trapezoid
      below the chin line, giving the bust a clothed, formal look.
    -->
    <path fill="#3E2610" opacity="0.70"
      d="
        M 58,158
        C 65,151 72,144 78,138
        C 82,134 83,129 82,124
        L 82,124
        C 85,128 88,134 90,142
        C 92,150 91,160 89,170
        C 87,179 86,190 85,200
        L 28,200
        C 36,183 48,168 58,158
        Z
      "
    />

    <!--
      Ear hint: small ellipse on the right side of the head,
      barely differentiated from the silhouette.
    -->
    <ellipse cx="142" cy="80" rx="6" ry="9"
             fill="#3A2210" opacity="0.60"/>

    <!--
      Hair mass: very slightly lighter than the silhouette over the
      crown and back of head, suggesting short side-parted hair
      without drawing individual strands.
    -->
    <path fill="#3E2814" opacity="0.50"
      d="
        M 85,20
        C 95,17 106,17 116,20
        C 126,23 135,30 141,40
        C 147,50 150,62 149,74
        L 144,72
        C 145,61 142,50 137,41
        C 131,32 122,26 112,22
        C 102,18 91,19 81,22
        Z
      "
    />

    <!-- Vignette overlay -->
    <circle cx="100" cy="100" r="100" fill="url(#vg)"/>

    <!-- Thin inner border ring for photo-frame definition -->
    <circle cx="100" cy="100" r="99" fill="none"
            stroke="rgba(180,150,100,0.18)" stroke-width="1.5"/>
  </g>
</svg>
